<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22341a">
  <meta name="robots" content="noindex">
  <title>Painel Administrativo</title>
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== TELA DE LOGIN ===== -->
  <div id="tela-login" class="login-tela oculto">
    <form id="form-login" class="card pad">
      <div style="display:flex;justify-content:center"><span class="selo-logo" style="width:72px;height:72px">
        <img src="img/simbolo.png" alt=""></span></div>
      <h1 style="text-align:center;font-size:28px;margin-top:14px">Área do Administrador</h1>
      <div class="grupo mt-g">
        <label class="rotulo" for="usuario">Usuário</label>
        <input id="usuario" class="campo" value="admin" autocomplete="username" required>
      </div>
      <div class="grupo">
        <label class="rotulo" for="senha">Senha</label>
        <input id="senha" type="password" class="campo" autocomplete="current-password" required>
      </div>
      <div id="erro-login" class="alerta erro oculto" role="alert"></div>
      <button class="btn btn-verde largura-total mt-g" id="btn-entrar">Entrar</button>
    </form>
  </div>

  <!-- ===== PAINEL ===== -->
  <div id="painel" class="oculto">
    <header class="topo">
      <div class="topo-conteudo">
        <span class="selo-logo"><img src="img/simbolo.png" alt=""></span>
        <div>
          <div class="igreja">Painel Administrativo</div>
          <div class="titulo">Eleição de Liderança</div>
        </div>
        <div class="acoes">
          <a href="index.html" target="_blank">Ver site</a>
          <button id="sair" class="btn btn-pequeno" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35)">Sair</button>
        </div>
      </div>
      <nav class="abas" aria-label="Seções">
        <button data-aba="resultados" class="ativa">Resultados</button>
        <button data-aba="candidatos">Candidatos</button>
        <button data-aba="eleitores">Eleitores</button>
        <button data-aba="config">Configurações</button>
      </nav>
    </header>

    <main class="conteudo largo">
      <section id="aba-resultados"></section>
      <section id="aba-candidatos" class="oculto"></section>
      <section id="aba-eleitores" class="oculto"></section>
      <section id="aba-config" class="oculto"></section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/resultados.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
